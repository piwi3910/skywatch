name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SkyWatch.sln

      - name: Build
        run: dotnet build SkyWatch.sln --no-restore -c Release

      - name: Format check
        run: dotnet format SkyWatch.sln --verify-no-changes --no-restore

      # Tests run on Windows only — OpenCvSharp native libraries (OpenCvSharpExtern)
      # require platform-specific runtime packages and system dependencies that are
      # not reliably available on ubuntu-latest GitHub runners.
      - name: Test
        if: runner.os == 'Windows'
        run: dotnet test SkyWatch.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
