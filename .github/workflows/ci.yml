name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install OpenCV native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev
          # OpenCvSharpExtern.so links against libtesseract.so.4; Ubuntu 24.04 ships .so.5
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtesseract.so.4 ] && [ -f /usr/lib/x86_64-linux-gnu/libtesseract.so.5 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libtesseract.so.5 /usr/lib/x86_64-linux-gnu/libtesseract.so.4
          fi

      - name: Restore
        run: dotnet restore SkyWatch.sln

      - name: Build
        run: dotnet build SkyWatch.sln --no-restore -c Release

      - name: Format check
        run: dotnet format SkyWatch.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test SkyWatch.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
